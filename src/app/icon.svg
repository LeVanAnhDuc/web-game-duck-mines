<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    A closed tile with a mine on it. The tile is the one shape the game is built on,
    and the border is what tells closed from open (invariant #8) - so the icon shows
    the border too. Colours are the light-theme literals from MASTER.md section 1;
    an SVG file cannot read CSS custom properties, and this is the only place in the
    repo allowed to repeat them.
  -->
  <rect x="1" y="1" width="30" height="30" rx="5" fill="#cbd5dd" stroke="#758593" stroke-width="2"/>
  <g stroke="#1b2733" stroke-width="2.5" stroke-linecap="round">
    <line x1="16" y1="6" x2="16" y2="26"/>
    <line x1="6" y1="16" x2="26" y2="16"/>
    <line x1="9" y1="9" x2="23" y2="23"/>
    <line x1="23" y1="9" x2="9" y2="23"/>
  </g>
  <circle cx="16" cy="16" r="6" fill="#1b2733"/>
</svg>
