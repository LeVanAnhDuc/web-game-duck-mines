name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Split in two on purpose: these run in parallel, and a lint failure and a broken
  # board are different pieces of news that should not queue behind each other.
  verify:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit and component tests
        run: yarn test

  # NFR-SEC-05 duoc gate o day chu khong bang mot buoc `yarn audit`. Endpoint
  # audit cua yarn 1 tra ve summary RONG kem exit 0, nen check-audit.mjs khong
  # thay advisory nao va di qua - cong nay da xanh suot ma chua tung do lan nao.
  # dependency-review chi xet dependency ma PR THEM VAO, khong thay lo hong da
  # co san; phan do do Dependabot lo. Doi lay mot cong that thay vi mot cong gia.
  dependencies:
    name: New dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  e2e:
    name: Build and end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Build the static export
        run: yarn build

      # NFR-PERF-07, measured from the exported HTML rather than from the build
      # table, so it breaks on a regression and not on a Next.js release.
      - name: First-load JS budget
        run: node scripts/check-bundle-size.mjs out

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Runs against out/ through scripts/serve.mjs - the thing GitHub Pages will
      # serve, at 375 / 768 / 1024 / 1440.
      - name: End-to-end tests
        run: yarn test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
